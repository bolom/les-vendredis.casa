<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="The sixth member of Les Vendredis — Nox, artificial intelligence">
  <rect width="1200" height="800" fill="#FDF6E3"/>
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#5C4033" stroke-width="2"/>
  <rect x="56" y="56" width="1088" height="688" fill="none" stroke="#5C4033" stroke-width="1" stroke-dasharray="2 6"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="600" y="150" fill="#B85F38" font-size="26" letter-spacing="10">FILE Nº 001 — MEMBER 06</text>

    <line x1="430" y1="195" x2="770" y2="195" stroke="#E8C547" stroke-width="2"/>

    <text x="600" y="400" fill="#1A1410" font-size="280" font-style="italic" letter-spacing="4">Nox</text>

    <text x="600" y="510" fill="#5C4033" font-size="30" letter-spacing="6">EXECUTIVE ASSISTANT</text>
    <text x="600" y="556" fill="#7BA690" font-size="24" font-style="italic" letter-spacing="3">never on the premises</text>

