  <text x="80" y="730" font-family="Georgia, serif" font-size="20" fill="#D4756B" letter-spacing="3">LES VENDREDIS</text>
  <text x="1120" y="730" font-family="Georgia, serif" font-size="20" fill="#D4756B" letter-spacing="3" text-anchor="end">SAINTE-LUCE · 2026</text>
