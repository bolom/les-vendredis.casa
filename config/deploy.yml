# Production deployment. The Caddy reverse proxy on the VPS routes the public
# domains to the app through Docker labels (see servers/web/labels).
service: les-vendredis
image: bolomichelin/les-vendredis

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_INFOMANIAK_HOST", "185.143.102.224") %>
    proxy: false
    labels:
      caddy: lesvendredis.casa, www.lesvendredis.casa
      caddy.reverse_proxy: "{{upstreams 80}}"
    options:
      expose:
        - "80"
      health-cmd: "curl -fsS http://127.0.0.1/up >/dev/null"
      health-interval: 10s
      health-timeout: 5s
      health-retries: 30
      health-start-period: 120s
  job:
    hosts:
      - <%= ENV.fetch("KAMAL_INFOMANIAK_HOST", "185.143.102.224") %>
    cmd: bin/jobs

ssh:
  user: ubuntu

registry:
  username: <%= ENV.fetch("KAMAL_REGISTRY_USER", "bolomichelin") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    GA_MEASUREMENT_ID: G-HD3V7YWDWQ
    MAIL_FROM: hello@lesvendredis.casa
    MAIL_REPLY_TO: hello@lesvendredis.casa
    BOOKING_OWNER_EMAIL: hello@lesvendredis.casa
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL

volumes:
  - "les_vendredis_storage:/rails/storage"

builder:
  arch: amd64
  context: .
  dockerfile: Dockerfile

accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("KAMAL_INFOMANIAK_HOST", "185.143.102.224") %>
    # Bind to the Docker bridge gateway so only containers on this host can
    # reach Postgres; the port is not exposed to the internet.
    port: "172.17.0.1:5433:5432"
    env:
      clear:
        POSTGRES_DB: les_vendredis
        POSTGRES_USER: les_vendredis
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - "les_vendredis_db:/var/lib/postgresql/data"
