name: Production Monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health endpoint
        run: curl --fail --silent --show-error --max-time 20 https://staging.lesvendredis.casa/up

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_rsa
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          ssh-keyscan -H 185.143.102.224 >> ~/.ssh/known_hosts

      - name: Check application, worker and critical jobs
        run: ssh ubuntu@185.143.102.224 sudo /usr/local/sbin/les-vendredis-production-health-check
